spring.main.banner-mode=off
server.tomcat.mbeanregistry.enabled=true
server.forward-headers-strategy=NONE
server.shutdown=graceful
# Server Configuration
server.port=8080
spring.application.name=jersey-demo
# Jersey Configuration
spring.jersey.application-path=/
# Actuator Configuration
management.server.port=8081
management.endpoints.web.exposure.include=info,health,prometheus,configprops,conditions,env,metrics
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.readiness.include=readinessState,db
# Application Info
info.app.name=Jersey Demo Application
info.app.description=Spring Boot 4 with Jersey and Actuator
info.app.version=1.0.0
# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
